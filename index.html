<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <p id="parrafo-ejemplo">Chango Marango</p>

    <script>
      let parrafo = document.getElementById("parrafo-ejemplo");
      console.log(parrafo);

      let parrafo2 = document.createElement("h1");

      let contenido = document.createTextNode("Hola");

      parrafo2.appendChild(contenido);

      setTimeout(() => {
        document.body.appendChild(parrafo2);
      }, 1000);

      setTimeout(() => {
        parrafo.parentNode.removeChild(parrafo2);
      }, 4000);
    </script>
  </body>
</html>
